<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#061f27"><title>BARAMEEL RUN — ALEXANDRIA Collection</title><link rel="stylesheet" href="./styles.css?v=20260929-19"><link rel="preload" as="image" href="./assets/screen06-puzzle.webp"></head><body><main class="collection-stage"><img id="art" class="collection-art" src="./assets/screen06-puzzle.webp" alt="ALEXANDRIA Collection" fetchpriority="high" decoding="async"><button id="back" class="collection-back" aria-label="Back"></button><select id="select" class="collection-select" aria-label="Choose collection"><option value="collection01">ALEXANDRIA</option></select><div id="heroGrid" class="hero-grid"></div><div id="reward" class="reward-text" aria-live="polite"></div><div id="rewardSub" class="reward-sub"></div><div class="collection-actions"><button id="myRewards" class="collection-action" type="button" aria-label="My Rewards"></button><button id="scanMore" class="collection-action" type="button" aria-label="Scan More"></button></div><div id="thumbs" class="collection-thumbs"></div><div id="completeFlash" class="complete-flash" aria-hidden="true"></div></main><script src="./app.js?v=20260929-19"></script><script>
(async()=>{
 const params=new URLSearchParams(location.search),collection=params.get('collection')||'collection01',selected=params.get('image')||'image01';let cfg;try{cfg=await BR.fetchCollection(collection)}catch{return}
 const hero=document.getElementById('heroGrid'),thumbs=document.getElementById('thumbs'),reward=document.getElementById('reward'),select=document.getElementById('select');let current=cfg.images.find(x=>x.imageId===selected)||cfg.images[0];select.value=collection;
 function crop(cell,piece,master){cell.style.backgroundImage=`url("./${master}")`;cell.style.backgroundSize='300% 300%';cell.style.backgroundPosition=`${(piece.column-1)*50}% ${(piece.row-1)*50}%`;cell.style.backgroundRepeat='no-repeat'}
 function renderHero(){hero.innerHTML='';hero.classList.remove('completed');const complete=BR.count(collection,current.imageId)===9;if(complete){const img=document.createElement('img');img.className='completed-image';img.alt=current.displayName;img.src=`./${current.masterFile}`;hero.classList.add('completed');hero.appendChild(img);return;}for(let n=1;n<=9;n++){const piece=current.pieces[n-1],cell=document.createElement('div');cell.className='hero-piece';crop(cell,piece,current.masterFile);cell.classList.add(BR.hasPiece(collection,current.imageId,n)?'is-collected':'is-missing');hero.appendChild(cell)}}
 const cardPositions=[[2.62,71.07,18.24,11.83],[22.12,71.07,17.92,11.83],[41.19,71.07,17.92,11.83],[60.17,71.07,17.82,11.83],[79.35,71.07,18.24,11.83],[2.62,83.38,18.24,12.07],[22.12,83.38,17.92,12.07],[41.19,83.38,17.92,12.07],[60.17,83.38,17.92,12.07],[79.35,83.38,18.24,12.07]];
 function thumb(im,index){const pos=cardPositions[index],wrap=document.createElement('button');wrap.type='button';wrap.className='collection-thumb';wrap.style.left=pos[0]+'%';wrap.style.top=pos[1]+'%';wrap.style.width=pos[2]+'%';wrap.style.height=pos[3]+'%';const grid=document.createElement('div');grid.className='thumb-grid';for(let n=1;n<=9;n++){const piece=im.pieces[n-1],cell=document.createElement('span');cell.className='thumb-piece';crop(cell,piece,im.masterFile);cell.classList.add(BR.hasPiece(collection,im.imageId,n)?'is-collected':'is-missing');grid.appendChild(cell)}const count=document.createElement('span');count.className='thumb-count';count.textContent=String(BR.count(collection,im.imageId));wrap.append(grid,count);wrap.onclick=()=>{current=im;render();BR.play('tap')};return wrap}
 function renderThumbs(){thumbs.innerHTML='';cfg.images.slice(0,10).forEach((im,index)=>thumbs.appendChild(thumb(im,index)))}
 function render(){renderHero();renderThumbs()}
 function rewardKey(r){return `${r?.at||Date.now()}|${r?.collection_id||r?.collection||''}|${r?.image_id||r?.image||''}|${r?.piece_number||r?.piece||''}`}
 function animateReward(){const r=BR.state.lastReward,amount=Number(r?.points||0);if(!r||!amount||r.duplicate)return;const key=rewardKey(r);if(localStorage.getItem('barameelRewardShownKey19')===key){reward.textContent='+'+amount.toLocaleString();return}localStorage.setItem('barameelRewardShownKey19',key);const start=performance.now(),duration=2300;BR.playPointsCountUp(amount,duration);function tick(now){const t=Math.min(1,(now-start)/duration),e=1-Math.pow(1-t,3);reward.textContent='+'+Math.round(amount*e).toLocaleString();const pulse=Math.sin(t*Math.PI);reward.style.transform=`rotate(-5deg) scale(${1+.22*pulse})`;if(t<1)requestAnimationFrame(tick);else{reward.textContent='+'+amount.toLocaleString();setTimeout(()=>reward.style.transform='rotate(-5deg)',240)}}requestAnimationFrame(tick)}
 function completeEffect(){const r=BR.state.lastReward,image=r?.image_id||r?.image;if(BR.count(collection,current.imageId)!==9||!r||image!==current.imageId||r.duplicate)return;const key=rewardKey(r)+'|complete';if(localStorage.getItem('barameelCompletionShownKey19')===key)return;localStorage.setItem('barameelCompletionShownKey19',key);BR.playCompletionSound()}
 render();animateReward();completeEffect();document.getElementById('back').onclick=()=>BR.goAfter('screen05.html','back',180);document.getElementById('myRewards').onclick=()=>BR.goAfter('screen04.html','select',180);document.getElementById('scanMore').onclick=()=>BR.goAfter('screen05.html','select',220);select.onchange=e=>{const im=cfg.images.find(x=>x.imageId===e.target.value);if(im){current=im;render()}};BR.track('collection_view');
})();
</script><script src="./register-sw.js?v=20260929-19"></script></body></html>
