<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>BARAMEEL RUN — ALEXANDRIA</title><link rel="stylesheet" href="./styles.css?v=20260930-20.4"><script src="./config.js?v=20260930-20.4"></script></head><body><main class="stage collection-stage"><img class="base" src="./assets/screen06-puzzle.webp" alt="ALEXANDRIA Collection"><button id="back" class="hotspot" style="left:2%;top:2%;width:20%;height:7%" aria-label="Back"></button><select id="select" style="position:absolute;left:27%;top:13%;width:46%;z-index:20;height:4%;font-weight:900"><option value="collection01">ALEXANDRIA</option></select><div id="heroGrid" class="hero-grid"></div><div id="reward" class="reward-text"></div><div id="thumbs" class="collection-thumbs"></div><button id="myRewards" class="hotspot" style="left:7%;top:81%;width:41%;height:9%" aria-label="My Rewards"></button><button id="scanMore" class="hotspot" style="left:52%;top:81%;width:41%;height:9%" aria-label="Scan More"></button><div id="completeFlash" class="barameel-flash"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./app.js?v=20260930-20.4"></script><script>(async()=>{const cfg=await BR.fetchCollection('collection01'),hero=document.getElementById('heroGrid'),thumbs=document.getElementById('thumbs'),reward=document.getElementById('reward');const current=cfg.images[0];function crop(el,p,src){el.style.backgroundImage=`url("./${src}")`;el.style.backgroundSize='300% 300%';el.style.backgroundPosition=`${(p.column-1)*50}% ${(p.row-1)*50}%`}function render(){hero.innerHTML='';for(let n=1;n<=9;n++){const p=current.pieces[n-1],c=document.createElement('div');c.className='hero-piece';crop(c,p,current.masterFile);c.classList.toggle('is-missing',!BR.hasPiece('collection01',current.imageId,n));c.classList.toggle('is-collected',BR.hasPiece('collection01',current.imageId,n));hero.appendChild(c)}thumbs.innerHTML='';const pos=[[2.62,71.07,18.24,11.83],[22.12,71.07,17.92,11.83],[41.19,71.07,17.92,11.83],[60.17,71.07,17.82,11.83],[79.35,71.07,18.24,11.83],[2.62,83.38,18.24,12.07],[22.12,83.38,17.92,12.07],[41.19,83.38,17.92,12.07],[60.17,83.38,17.92,12.07],[79.35,83.38,18.24,12.07]];cfg.images.forEach((im,idx)=>{const b=document.createElement('button');b.type='button';b.className='collection-thumb';b.style.cssText=`left:${pos[idx][0]}%;top:${pos[idx][1]}%;width:${pos[idx][2]}%;height:${pos[idx][3]}%`;for(let n=1;n<=9;n++){const p=im.pieces[n-1],c=document.createElement('span');c.className='thumb-piece';crop(c,p,im.masterFile);c.classList.toggle('is-missing',!BR.hasPiece('collection01',im.imageId,n));b.appendChild(c)}const badge=document.createElement('span');badge.className='thumb-index';badge.textContent=idx+1;b.appendChild(badge);const count=document.createElement('span');count.className='thumb-count';count.textContent=BR.count('collection01',im.imageId);b.appendChild(count);b.onclick=()=>{BR.play('tap');renderImage(im)};thumbs.appendChild(b)})}function renderImage(im){hero.innerHTML='';for(let n=1;n<=9;n++){const p=im.pieces[n-1],c=document.createElement('div');c.className='hero-piece';crop(c,p,im.masterFile);c.classList.toggle('is-missing',!BR.hasPiece('collection01',im.imageId,n));hero.appendChild(c)}}render();const handoff=JSON.parse(sessionStorage.getItem('barameelLastScan')||'null');if(handoff){reward.textContent=handoff.points&&!handoff.duplicate?'+'+Number(handoff.points).toLocaleString():'';if(!handoff.duplicate)BR.playPointsCountUp(Number(handoff.points||0));if(BR.count('collection01',handoff.image_id||handoff.image)===9){BR.playCompletionSound();BR.flash()}}back.onclick=()=>BR.goAfter('screen05.html','back',180);myRewards.onclick=()=>BR.goAfter('screen04.html','confirm',180);scanMore.onclick=()=>BR.goAfter('screen05.html','scan',180);BR.track('collection_view')})();</script></body></html>
