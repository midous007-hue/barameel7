<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>BARAMEEL RUN — My Progress</title><link rel="stylesheet" href="./styles.css?v=20260930-20"><script src="./config.js?v=20260930-20"></script></head><body><main class="rewards-stage"><img id="rewardsArt" class="rewards-art" src="./assets/screen04-rewards.webp" alt="My Progress"><div class="progress-data"><span id="pointsValue" class="progress-value points-value">0</span><span id="rankValue" class="progress-value rank-value">—</span><span id="weeklyValue" class="progress-value weekly-value">0</span><span id="checkpointValue" class="progress-value checkpoint-value">0</span><div id="checkpointDots" class="checkpoint-dots"></div></div><button id="back" class="rewards-back" aria-label="Back"></button><button id="scan" class="rewards-scan-hotspot" aria-label="Scan QR"></button></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./app.js?v=20260930-20"></script><script>(async()=>{await BR.syncPlayer();const s=BR.state;pointsValue.textContent=(Number(s.points)||0).toLocaleString();rankValue.textContent=s.rank?`#${s.rank}`:'—';weeklyValue.textContent=(Number(s.weeklyPoints)||0).toLocaleString();checkpointValue.textContent=(s.checkpoints||[]).length;for(let i=0;i<6;i++){const d=document.createElement('span');d.className='checkpoint-dot'+(i<(s.checkpoints||[]).length?' on':'');checkpointDots.appendChild(d)}back.onclick=()=>BR.goAfter('screen03.html','back',220);scan.onclick=()=>BR.goAfter('screen05.html','scan',180);BR.track('progress_view')})();</script></body></html>
